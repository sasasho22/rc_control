<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RC Pad</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#111418;--fg:#e8edf2;--dim:#7d8894;--acc:#3ddc97;--warn:#ff6b6b;--zone:#1b2027;--line:#2c343d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pad{position:fixed;inset:0;display:flex;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:8px}
#pad.swap{flex-direction:row-reverse}
.zone{flex:1;position:relative;background:var(--zone);border-radius:16px;overflow:hidden;touch-action:none}
.zone .label{position:absolute;top:12px;left:0;right:0;text-align:center;color:var(--dim);font-size:13px;pointer-events:none}
.zone.active{outline:2px solid var(--acc);outline-offset:-2px}
.hint-t,.hint-b{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);pointer-events:none;padding:0 8px}
.hint-t{top:38px}
.hint-b{bottom:12px}
#wheelWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#wheel{position:relative;width:50vh;height:50vh;border:6px solid var(--line);border-radius:50%}
#wheel::before{content:"";position:absolute;left:50%;top:-6px;width:14px;height:22px;margin-left:-7px;background:var(--acc);border-radius:4px}
#wheel::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:6px;margin-top:-3px;background:var(--line);border-radius:3px}
#ring,#dot,#line{position:fixed;pointer-events:none;display:none}
#ring{width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid var(--dim);border-radius:50%}
#dot{width:30px;height:30px;margin:-15px 0 0 -15px;background:var(--acc);border-radius:50%}
#line{width:4px;margin-left:-2px;background:var(--acc);opacity:.6}
#status{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:4;font-size:12px;color:var(--fg);background:#000a;padding:3px 10px;border-radius:10px;pointer-events:none;max-width:92vw;text-align:center}
#gear{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:5;background:#252c35;color:var(--fg);border:0;border-radius:14px;padding:4px 14px;font-size:13px}
#panel{position:fixed;inset:34px 12px 12px;z-index:6;background:#0d1013f2;border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#panel.open{display:block}
#panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
#panel label{display:block;font-size:12px;color:var(--dim)}
#panel label b{color:var(--fg);font-weight:600;float:right}
#panel input[type=range]{width:100%}
#panel .tg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg);padding:6px 0}
#panel button{margin-top:10px;background:#252c35;color:var(--fg);border:0;border-radius:10px;padding:8px 14px;font-size:13px}
#overlay,#rot{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#rot{display:none;z-index:9}
@media (orientation:portrait){#rot{display:flex}}
#startBtn{background:var(--acc);color:#06281a;border:0;border-radius:14px;padding:14px 34px;font-size:18px;font-weight:700}
#msg{color:var(--warn);font-size:13px;min-height:1.2em;line-height:1.7;max-width:40em;text-align:left}
#msg b{color:var(--fg)}
.sm{color:var(--dim);font-size:13px;line-height:1.6;max-width:36em}
</style>
</head>
<body>

<div id="pad">
  <div class="zone" id="thrZone">
    <div class="label">アクセル / ブレーキ</div>
    <div class="hint-t">指を置いた位置が0 ／ 下へ＝アクセル ／ 上へ＝ブレーキ</div>
  </div>
  <div class="zone" id="steerZone">
    <div class="label">ステアリング</div>
    <div id="wheelWrap"><div id="wheel"></div></div>
    <div class="hint-b">触れている間だけ傾きが有効（触れた時の角度が0）</div>
  </div>
</div>
<div id="ring"></div><div id="line"></div><div id="dot"></div>
<div id="status"></div>
<button id="gear">⚙ 設定</button>
<div id="panel"></div>

<div id="rot"><div style="font-size:40px">⟳</div><div>スマホを横向きにしてください</div></div>

<div id="overlay">
  <h2 style="margin:0">RC コントローラー</h2>
  <div class="sm">スマホを横に持って、ハンドルのように傾けます。<br>左側：指を置いて上下にスライド（下＝アクセル、上＝ブレーキ）<br>右側：触れている間だけ傾きでステアリング</div>
  <button id="startBtn">スタート</button>
  <div id="msg"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const pcId = params.get("id");

/* ---------- 設定 ---------- */
const DEFAULTS = {
  steerRange: 45,   // ステアリング全開になる傾き(度)
  steerDead: 2,     // 不感帯(度)
  thrRange: 25,     // スロットル全開になる指の移動量(画面の高さに対する%)
  thrDead: 4,       // 不感帯(全開量に対する%)
  steerReturn: 4,   // 指を離した時の戻り速度(1秒あたり)
  thrReturn: 8,
  invertThr: false, // 上下反転（下＝ブレーキ、上＝アクセル）
  invertSteer: false,
  swap: false       // 左右の役割入れ替え
};
const FIELDS = [
  ["steerRange", "ステアリング全開の角度 (°)", 15, 90, 1],
  ["steerDead", "ステアリング不感帯 (°)", 0, 10, 0.5],
  ["thrRange", "スロットル全開の指の移動量 (画面高%)", 10, 60, 1],
  ["thrDead", "スロットル不感帯 (%)", 0, 30, 1],
  ["steerReturn", "ステアリング戻り速度", 1, 20, 0.5],
  ["thrReturn", "スロットル戻り速度", 1, 20, 0.5]
];
const TOGGLES = [
  ["invertThr", "スロットル上下反転"],
  ["invertSteer", "ステアリング左右反転"],
  ["swap", "左右の役割を入れ替え（左利き用）"]
];
const cfg = Object.assign({}, DEFAULTS);
try { Object.assign(cfg, JSON.parse(localStorage.getItem("rcpad.cfg") || "{}")); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem("rcpad.cfg", JSON.stringify(cfg)); } catch (e) {} };

function buildPanel() {
  const p = $("panel");
  p.innerHTML = '<div class="grid"></div>';
  const g = p.firstChild;
  FIELDS.forEach(([k, name, min, max, step]) => {
    const l = document.createElement("label");
    l.innerHTML = name + "<b></b>";
    const inp = document.createElement("input");
    inp.type = "range"; inp.min = min; inp.max = max; inp.step = step; inp.value = cfg[k];
    const b = l.querySelector("b"); b.textContent = cfg[k];
    inp.oninput = () => { cfg[k] = +inp.value; b.textContent = inp.value; saveCfg(); };
    l.appendChild(inp); g.appendChild(l);
  });
  TOGGLES.forEach(([k, name]) => {
    const l = document.createElement("label"); l.className = "tg";
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = cfg[k];
    c.onchange = () => { cfg[k] = c.checked; saveCfg(); applySwap(); };
    l.appendChild(c); l.appendChild(document.createTextNode(name)); g.appendChild(l);
  });
  const r = document.createElement("button"); r.textContent = "初期値に戻す";
  r.onclick = () => { Object.assign(cfg, DEFAULTS); saveCfg(); buildPanel(); applySwap(); };
  const c = document.createElement("button"); c.textContent = "閉じる";
  c.onclick = () => p.classList.remove("open");
  p.appendChild(r); p.appendChild(c);
}
const applySwap = () => $("pad").classList.toggle("swap", cfg.swap);
$("gear").onclick = () => $("panel").classList.toggle("open");
buildPanel(); applySwap();

/* ---------- センサー（重力方向から画面内の傾きを求める） ---------- */
let theta = 0, hasSensor = false, fx = 0, fy = 0, fInit = false;
window.addEventListener("devicemotion", e => {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null || a.y == null) return;
  const ang = screen.orientation ? screen.orientation.angle : -(window.orientation || 0);
  const n = ((ang % 360) + 360) % 360;
  let sx, sy;
  switch (n) {
    case 90:  sx = -a.y; sy = a.x;  break;
    case 180: sx = -a.x; sy = -a.y; break;
    case 270: sx = a.y;  sy = -a.x; break;
    default:  sx = a.x;  sy = a.y;
  }
  if (!fInit) { fx = sx; fy = sy; fInit = true; }
  fx += (sx - fx) * 0.6; fy += (sy - fy) * 0.6;   // 軽いローパス
  theta = Math.atan2(-fx, fy);                    // 時計回りに回すと＋（iOS/Androidの符号差は相対角で吸収）
  hasSensor = true;
});
const wrap = d => Math.atan2(Math.sin(d), Math.cos(d));

/* ---------- タッチ ---------- */
let thrT = null, steerT = null, base = 0;
const thrZone = $("thrZone"), steerZone = $("steerZone");

thrZone.addEventListener("pointerdown", e => {
  if (thrT) return;
  thrT = { id: e.pointerId, x: e.clientX, y0: e.clientY, y: e.clientY };
  thrZone.setPointerCapture(e.pointerId); thrZone.classList.add("active");
});
thrZone.addEventListener("pointermove", e => { if (thrT && e.pointerId === thrT.id) thrT.y = e.clientY; });
const thrUp = e => { if (thrT && e.pointerId === thrT.id) { thrT = null; thrZone.classList.remove("active"); } };
thrZone.addEventListener("pointerup", thrUp);
thrZone.addEventListener("pointercancel", thrUp);

steerZone.addEventListener("pointerdown", e => {
  if (steerT) return;
  steerT = { id: e.pointerId }; base = theta;   // 触れた瞬間の姿勢を0にする
  steerZone.setPointerCapture(e.pointerId); steerZone.classList.add("active");
});
const steerUp = e => { if (steerT && e.pointerId === steerT.id) { steerT = null; steerZone.classList.remove("active"); } };
steerZone.addEventListener("pointerup", steerUp);
steerZone.addEventListener("pointercancel", steerUp);
["gesturestart", "contextmenu"].forEach(t => document.addEventListener(t, e => e.preventDefault()));

/* ---------- 出力値の計算ループ ---------- */
const S = { steer: 0, thr: 0 };   // thr: ＋アクセル / －ブレーキ
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shape = (v, dz) => { const s = Math.sign(v), m = Math.abs(v); return s * clamp((m - dz) / (1 - dz), 0, 1); };
const toward = (cur, target, step) => cur < target ? Math.min(target, cur + step) : Math.max(target, cur - step);

let conn = null, peer = null, last = performance.now();
const ring = $("ring"), dot = $("dot"), line = $("line"), wheel = $("wheel");

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // ステアリング
  if (steerT && hasSensor) {
    let deg = wrap(theta - base) * 180 / Math.PI;
    if (cfg.invertSteer) deg = -deg;
    const target = shape(deg / cfg.steerRange, cfg.steerDead / cfg.steerRange);
    S.steer += (target - S.steer) * Math.min(1, dt * 30);
  } else {
    S.steer = toward(S.steer, 0, cfg.steerReturn * dt);   // バネ戻り
  }

  // スロットル
  if (thrT) {
    const range = cfg.thrRange / 100 * innerHeight;
    let v = (thrT.y - thrT.y0) / range;          // 下へ動かす＝＋
    if (cfg.invertThr) v = -v;
    S.thr = shape(clamp(v, -1, 1), cfg.thrDead / 100);
    const yMax = range;
    const dy = clamp(thrT.y - thrT.y0, -yMax, yMax);
    ring.style.display = dot.style.display = line.style.display = "block";
    ring.style.left = dot.style.left = line.style.left = thrT.x + "px";
    ring.style.top = thrT.y0 + "px"; dot.style.top = (thrT.y0 + dy) + "px";
    line.style.top = Math.min(thrT.y0, thrT.y0 + dy) + "px"; line.style.height = Math.abs(dy) + "px";
  } else {
    S.thr = toward(S.thr, 0, cfg.thrReturn * dt);
    ring.style.display = dot.style.display = line.style.display = "none";
  }

  wheel.style.transform = "rotate(" + (S.steer * cfg.steerRange * (cfg.invertSteer ? -1 : 1)) + "deg)";

  // 送信（毎フレーム。順序保証なしの低遅延チャネル）
  if (conn && conn.open) {
    conn.send({ s: +S.steer.toFixed(3), t: +Math.max(0, S.thr).toFixed(3), b: +Math.max(0, -S.thr).toFixed(3) });
  }
  requestAnimationFrame(loop);
}

/* ---------- 接続（WebRTC / PeerJS） ---------- */
const status = t => { $("status").textContent = t; };
function connect() {
  if (!pcId) { status("テストモード（PCには送信されません）"); return; }
  status("接続中…");
  try { if (peer) peer.destroy(); } catch (e) {}
  peer = new Peer();
  peer.on("open", openConn);
  peer.on("error", err => {
    status("接続エラー(" + err.type + ")。再試行中…");
    setTimeout(connect, 2000);
  });
}
function openConn() {
  conn = peer.connect(pcId, { reliable: false, serialization: "json" });
  const c = conn, pc = c.peerConnection, types = new Set();
  const report = () => { if (!c.open) status("接続中… ICE:" + (pc ? pc.iceConnectionState : "?") + " 候補:" + ([...types].join(",") || "なし")); };
  if (pc) {
    pc.addEventListener("icecandidate", e => { if (e.candidate && e.candidate.type) { types.add(e.candidate.type); report(); } });
    pc.addEventListener("iceconnectionstatechange", report);
  }
  setTimeout(() => { if (!c.open && conn === c) { report(); status($("status").textContent + " ／ 10秒たっても接続できません"); } }, 10000);
  conn.on("open", () => status("接続済み"));
  conn.on("close", () => { status("切断されました。再接続中…"); setTimeout(connect, 1500); });
  conn.on("error", () => status("通信エラー"));
}

/* ---------- スタート（iOSのセンサー許可・画面常時点灯など） ---------- */
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(navigator.userAgent);

// センサーが使えないときの案内（設定画面はWebページから直接開けないため、手順を表示する）
function helpHtml() {
  if (IS_ANDROID) return "<b>モーションセンサーが許可されていません。</b><br>" +
    "① アドレスバー左のアイコン（🔒など）をタップ →「権限」または「サイトの設定」<br>" +
    "② 「モーションセンサー」を<b>許可</b>にする<br>" +
    "（見つからない場合：Chrome右上の︙ → 設定 → サイトの設定 → モーションセンサー → 許可）<br>" +
    "③ このページを再読み込みして、もう一度「スタート」";
  if (IS_IOS) return "<b>モーションセンサーが許可されていません。</b><br>" +
    "Safariのタブを閉じてアプリを完全に終了し、ページを開き直して、確認ダイアログで「許可」を押してください。";
  return "<b>傾きセンサーの値が取得できません。</b><br>HTTPSで開いているか、ブラウザのサイト設定でモーションセンサーが許可されているか確認してください。";
}
function showHelp(extra) {
  $("msg").innerHTML = helpHtml() + (extra ? "<br><small>" + extra + "</small>" : "");
  $("startBtn").textContent = "もう一度試す";
  $("overlay").style.display = "flex";
}

let started = false;
$("startBtn").onclick = async () => {
  const msg = $("msg"); msg.textContent = "";
  try {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") { showHelp(); return; }
    }
  } catch (e) { showHelp("詳細: " + e.message); return; }
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await screen.orientation.lock("landscape"); } catch (e) {}
  $("overlay").style.display = "none";
  if (!started) {
    started = true;
    connect();
    requestAnimationFrame(t => { last = t; loop(t); });
  }
  // センサーの値が届かない場合は、手順つきの案内を出す
  setTimeout(() => {
    if (!hasSensor) {
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
      showHelp();
    }
  }, 1500);
};
</script>
</body>
</html>
